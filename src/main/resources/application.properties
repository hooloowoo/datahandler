spring.application.name=datahandler

# Maximum amount an event's timestamp may lag behind its device's watermark before the
# reading is dropped instead of accepted-but-flagged-late. See OrderingTracker.
ingestion.allowed-lateness=PT30S

# Simulated temperature + vibration devices feeding the ingestion pipeline for demo purposes.
simulation.enabled=true

# Reading pipeline processing is decoupled from ingestion via a JMS queue on an embedded
# Artemis broker (no external broker process needed). Disabled in tests for determinism.
pipeline.async.enabled=true
spring.artemis.mode=embedded

# Serve the hand-authored openapi.yml (under static/) instead of springdoc's annotation-scanned spec.
springdoc.swagger-ui.url=/openapi.yml
springdoc.swagger-ui.path=/
